name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reusable gate: generator coverage/drift check + typecheck + full build. The linters
  # it also used to run were deactivated on 2026-08-14; see validate.yml's header for
  # what was removed and how to restore any of it.
  # Runs on BOTH push and pull_request, so a sync/regen PR is
  # gated before merge (a bot-opened PR under GITHUB_TOKEN can't rely on the
  # pull_request event firing, but human PRs and pushes trigger this here).
  validate:
    uses: ./.github/workflows/validate.yml

  # Deploy only on a real push to main (or manual dispatch) — never on a PR.
  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    # Serialize all deploying events onto gh-pages (the workflow-level per-ref group
    # only isolates validate runs; deploys must not race across refs).
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the sitemap plugin can stamp each page's <lastmod>.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install d2 CLI
        run: |
          curl -fsSL https://d2lang.com/install.sh | sh -s -- --version v0.7.1
          d2 --version
      - name: Build Docusaurus site
        run: npm run build
        # Visitor analytics: the PostHog client module reads these at build time
        # (docusaurus.config customFields) and bakes them into the shipped bundle.
        # Set POSTHOG_KEY as a repository Variable to go live; it is intentionally
        # NOT in source. With it unset the module is inert (analytics-free build).
        # Region/proxy hosts default to US Cloud in code, so the two *_HOST vars
        # are optional — set POSTHOG_API_HOST to a first-party reverse proxy once
        # the custom domain is live. Only this deploy build carries the key; the
        # validate/PR build stays analytics-free.
        env:
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST }}
          POSTHOG_UI_HOST: ${{ vars.POSTHOG_UI_HOST }}
      # Playwright is needed here for `npm run pdf`, which renders the reference PDFs
      # through Chromium. This cache now serves only this job: validate.yml stopped
      # installing or caching Chromium on 2026-08-14 when the rendered-CSS linter was
      # deactivated, so the cross-job seeding this comment used to describe — main
      # seeding a cache that PR runs consume, saving the ~28 s cold install measured on
      # run 30905661865 — no longer happens. Kept because this job still pays the
      # install without it.
      # v6 for the Node-24 runtime — see the fuller note at the matching step in
      # validate.yml. The two must stay on the SAME major as well as the same key: they
      # share one cache entry by design, and a cross-major format change would silently
      # cost the warm hit this step exists for.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate API reference PDFs
        run: npm run pdf
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          # Canonical commit identity for this repository. Every commit, on every
          # branch, is authored and committed as this single identity — see the
          # 2026-08-25 normalisation that unified all 100 commits on main and the
          # gh-pages deploy commit onto it.
          # This was `al1913-zebra <al1913-zebra@users.noreply.github.com>`: the same
          # person, but a second identity, so each deploy reintroduced a second
          # contributor to the graph. force_orphan below means gh-pages is replaced
          # wholesale every deploy, so this value alone determines its authorship.
          user_name: Abdul Latheef Mohamed
          user_email: abdullatheef.mohamed@zebra.com
          force_orphan: true
