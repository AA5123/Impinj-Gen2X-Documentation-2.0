name: Validate (reference gen + build)

# LINTERS ARE DEACTIVATED, 2026-08-14, by owner instruction ("Remove/deactive all linters for now").
#
# This job used to be 547 lines and ran twenty-odd checkers: reference integrity, prose against the
# style guide, section architecture, admonition budgets, badge palette, rendered-CSS contrast, route
# classes, head metadata, schema-versus-prose field tables, table-of-contents freshness and the
# disclosure guard. They were removed together with the rulebooks they read, because two of them read
# a rulebook at runtime, so keeping the linters while moving their inputs would have failed CI.
#
# RESTORING ANY OF THEM — read this before looking for the files. They are in NO clone and in NO
# commit reachable from this repository: its history begins at the initial commit. The originals are
# retained offline by the owner, so restoring one is a request to the owner, not a git command.
#
# ONE OF THE REMOVED CHECKS WAS NOT A STYLE LINTER, and it is the one to restore first.
# `scripts/preflight.mjs` was the disclosure guard: it scanned tracked files for absolute paths,
# account names, session ids and credentials. Nothing enforces that now, so a leak of that kind
# reaches the published tree unopposed. Restoring it needs the file from the owner, plus its step in
# this workflow and its npm alias.
#
# What still runs is what the documentation cannot be published without: the generator's own coverage
# and drift check, the typecheck, and the build.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # Was 20 minutes when this job also spawned a preview server and Chromium for the rendered-CSS
    # sweep. Neither runs now, so the ceiling is cut to 15 — still generous for install + build.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r scripts/api/mqtt/requirements.txt
          npm ci --no-audit --no-fund
      # d2 renders the architecture diagrams at build time. The build fails without it, so this is a
      # build dependency and not a lint step.
      - name: Install d2 CLI
        run: curl -fsSL https://d2lang.com/install.sh | sh -s -- --version v0.7.1
      # KEPT DELIBERATELY. This is not a linter: it is the generator asserting that the 25 pages it
      # owns under api/mqtt/reference/ still equal a fresh generation from api/mqtt/schema/, which is the
      # single source of truth. A drift here means the published reference contradicts the schema.
      - name: Generator coverage + drift check
        run: python3 scripts/api/mqtt/generate_reference.py --check
      # AND THIS IS THE CHECK THE STEP ABOVE CANNOT BE. The 24 operation pages are CARRY:
      # build_page returns their body verbatim before any schema read, so the drift check
      # compares a fresh generation of hand-typed prose against itself and passes whatever the
      # contract says. Measured: a full green `--check` run opens exactly TWO files under
      # api/mqtt/schema/, and none of the 113 payload-shaped ones. So a field added, removed or
      # retyped in the contract moved NOTHING on any page, and nothing noticed.
      #   This step is the missing comparison: every hand-typed field name, type, requiredness
      # and allowed-value list against the contract that supersedes them. Its first run found
      # 141 contradictions -- among them nine command payloads published as OPTIONAL that the
      # contract requires, `qos`/`retain` published as required where only `topic` is, and an
      # interface-status row publishing the association-status vocabulary. It also found five
      # bugs in the generator's own row model, every one of which would have silently DELETED
      # real fields from published pages had a page been converted to @slot first.
      #   Threshold 0, and it is green on the tree it lands with. It reports CONTRADICTIONS
      # only -- prose that adds what the contract does not model is editorial and passes -- and
      # its four deliberate blind spots are named in the module docstring rather than left for
      # someone to discover.
      # ITS SELF-TEST, ADDED 2026-09-09 WITH THE ENUM-ORDER CLASS. This module had none for its
      # whole life, and the class that was just added is the one where a subtle rule lives, so
      # the enum comparison was extracted into a pure function to make it testable. 22 cases,
      # half of which must produce a finding.
      #   WHY THE CLASS EXISTS. docs/prose-vs-schema-audit.md:90 has always said of `enumUnits`
      # that "order and membership both matter", and this module tested MEMBERSHIP ONLY. Ten
      # arrays were corrected by hand on 2026-09-09 against a gate that could not see the
      # difference, so the next reorder of any of them would have passed green.
      #   IT ASSERTS A SUBSEQUENCE, NOT EQUALITY, which is what makes it worth having: a page
      # may legitimately publish a SUBSET of an enum, and equality would have to skip those
      # rows -- 78 of 294 multi-value arrays on this tree. Subsequence covers 288 and is born
      # at 0. The 6 contained by no contract enum are skipped, not reported; they are unit-word
      # lists that render in the same cell, and reporting them would have made the class born
      # red on six correct rows.
      #   Proven end to end before landing: reverting one of the ten fixes produces exactly 3
      # ENUM-ORDER findings naming the pointer, both orders and the rule.
      - name: Reconcile self-test (proves the enum classes can fire)
        run: npm run gen:reconcile:selftest
      - name: MQTT prose agrees with the AsyncAPI contract
        run: npm run gen:reconcile
      # EVERY PUBLISHED PAYLOAD MUST BE A PAYLOAD THE CONTRACT SHIPS - added 2026-09-09, and it
      # closes the hole the step above CANNOT see. gen:reconcile compares field names, types,
      # requiredness and allowed-value lists between the prose tables and the contract; it never
      # reads a payload literal. gen:check cannot either, for the reason recorded above it: all 24
      # operation pages are CARRY, so its drift test compares a fresh generation of hand-typed
      # prose against itself.
      #   So the JSON body a reader copies off the page was guarded by nothing. 43 of them were
      # found to diverge from the contract by hand on 2026-09-09 - a discovery method that neither
      # scales nor repeats, which is the whole argument for this step.
      #
      # THE DESIGN POINT WORTH KNOWING BEFORE EDITING IT: there are TWO payload surfaces and they
      # need different rules. `<ApiBody json={}>` (100 bindings) is the page's own request or
      # response body and must match an example on the message that page documents - per-message,
      # because 195 examples carry only 178 distinct names, so a flat membership test would pass a
      # body belonging to another operation. `<JsonBlock data={}>` (58 bindings) is deliberately
      # CROSS-MESSAGE: set_os shows an alertEvent progress event because that is what a reader
      # actually observes during an update. A single strict join over both surfaces would be born
      # at 7 findings, 4 of them false positives.
      #
      # THRESHOLD 0, NO BASELINE, and it is satisfiable: 0 findings on the tree it lands with.
      # The 3 real gaps are WAIVED IN A FILE THAT PRINTS IN FULL ON EVERY RUN
      # (config/payload-parity-waivers.json) - all three are the same cause, set-os.mdx walking a
      # firmware update through 87%, 98% and 100% against a contract that carries exactly one
      # FIRMWARE_UPDATE progress example, at 20%. A stale waiver is itself a failure, so the file
      # cannot rot into an allowlist.
      #
      # Its self-test runs first, as every other gate here does, and it is not ceremony: 22 cases,
      # of which the two that matter prove the check can fail on a payload matching an example on
      # the WRONG message, and on a waiver whose page or const no longer exists.
      - name: Payload-parity self-test (proves the check can fail)
        run: npm run lint:payload-parity:selftest
      - name: Published payloads are contract examples (threshold 0)
        run: npm run lint:payload-parity
      # THE VARIANT DROPDOWN LABELS AND THEIR ORDER - added 2026-09-09, and it guards the one
      # reader-facing surface in this reference that no gate had ever read: the strings in the
      # payload `Select` control on every operation page.
      #   They were unnormalised from the initial commit until 2026-09-09 - `Delete wifi ca cert`,
      # `WPA2 Personal connection`, `Network alert for ethernet`, 20 of them - while the CONTRACT
      # carried the correct spelling all along. Nothing noticed for the whole of that window,
      # because a `label` attribute is just a string in prose. All 20 were found by hand
      # (.ai-history/077-select-variant-fix.md), which is not a method that repeats.
      #
      # PER-MESSAGE, AND THAT IS THE PROPERTY THAT MAKES IT CORRECT. The contract has 195 examples
      # but only 178 distinct names, because uniqueness is scoped to the message (example-naming
      # N-19). A membership test against a flat set of all names would pass a label belonging to a
      # different operation - which is the failure mode this gate exists to prevent, so it joins
      # via each page's own req_ptr/resp_ptr and follows the channel $ref to get there.
      #
      # IT ALSO CHECKS ORDER, against config/variant-order.json - OUR file, not the contract's.
      # Ordering specification C-2: "example order carries no published meaning to consumers that
      # select by value", and this UI selects by value (VariantSelect.tsx:288), so the contract's
      # examples[] order is not the source of ours and reordering it would not move the UI. What
      # the file buys is that an UNINTENDED reorder fails loudly instead of shipping. It is
      # exhaustive over all 17 controls, including the ten nobody has proposed changing, because
      # a partial list appends silently while a complete one fails.
      #
      # NO BASELINE, THRESHOLD 0, and the contrast with gen:contract-lint above is deliberate:
      # that gate is baselined because its findings are unfixable from here, so a zero threshold
      # would sit permanently red. Every finding THIS gate reports is fixable in prose. Measured 0.
      # config/variant-label-waivers.json exists and is EMPTY - a documented escape hatch rather
      # than a list of things already escaped, printed in full on every run, with stale entries
      # reported as failures so it cannot rot into an allowlist.
      #
      # 23 self-test cases. The two that matter most assert the flat-set mistake is really a
      # mistake on this corpus, and that a <VariantView> follower's labels are excluded from the
      # verdict but still printed - it renders no <select>, so its `label` props reach no reader;
      # counting them reports 22 findings where 20 are real, and ignoring them lets a dead string
      # rot. Proven end to end before landing: reverting one label fix and one reorder produces
      # exactly one finding of each kind and exit 2.
      - name: Variant-label self-test (proves the check can fail)
        run: npm run lint:variant-labels:selftest
      - name: Variant labels and order (threshold 0)
        run: npm run lint:variant-labels
      # FILE NAMES CONFORM TO ZIOTC-STD-001 - wired 2026-09-09, and the date it was wired is
      # the point. The specification and this validator landed on 2026-09-09 reporting 5
      # findings, and the check was deliberately NOT stepped in then: docs/standards/
      # FILE_NAMING_SPECIFICATION.md section 6 argues at length that a gate born red is a gate
      # born ignored, and wiring its own gate red would have refuted the document in the act of
      # publishing it. The precedent it followed is lint:schema-citations below, whose self-test
      # is wired and whose check is still commented out with its one precondition named.
      #   The five were cleared the same day - two config renames, one file untracked, one
      # renamed with a supersession banner, one renamed with 8 referrers updated and 11 archival
      # citations left alone as a recorded departure. So this is threshold 0 with no baseline,
      # measured 0 on the tree it lands with.
      #
      # SCOPE IS THE LOAD-BEARING PART, not the regexes. 6,064 tracked files, 541 in scope: a
      # tree is exempt only for a reason that would still be true if somebody disagreed with the
      # specification - vendored or separately-versioned, generated, or an archival record.
      # Without that scope a Layer 0 gate alone would be born at 86 findings, 85 of them
      # unfixable, which is the shape this file already records as the reason twenty-odd linters
      # were deactivated on 2026-08-14. `npm run lint:file-names:census` prints every exemption
      # with its reason, so the scope cannot quietly widen.
      #
      # THE HOOK IS NOT A SUBSTITUTE FOR THIS STEP, and vice versa. .githooks/pre-commit checks
      # only files a commit ADDS or RENAMES, which is what let it be installed with no
      # preconditions; it is also local config that does not survive a clone. This step is the
      # full-tree sweep, and it is the one that runs for everybody.
      #
      # 39 self-test cases, 15 of which must produce a finding, and it aborts if its own
      # fixtures fail so a broken edit cannot report a clean tree. Both spellings of the two
      # renamed configs are fixtures - snake must fail, kebab must pass - so the migration is
      # asserted in both directions rather than merely believed.
      - name: File-name self-test (proves the check can fail)
        run: npm run lint:file-names:selftest
      - name: File names conform to ZIOTC-STD-001 (threshold 0)
        run: npm run lint:file-names
      # THE REST REFERENCE HAS NO STEP OF ITS OWN, AND THAT IS A STATEMENT ABOUT THE DESIGN.
      #
      # It had two in the space of three days, and both are gone because what they guarded went
      # away. `npm run lint:rest-ids:selftest` guarded a page-id collision in
      # docusaurus-openapi-docs, which named every page kebabCase(operationId ?? summary) and so
      # emitted 72 files for 73 operations, silently dropping the radio-packet-log purge.
      # `npm run elements:css:check` guarded a committed derived stylesheet: @stoplight/elements
      # ships a Tailwind preflight written against html/body/a/h1-h6, so its sheet had to be
      # re-anchored under a container class and the result kept in step with the installed version.
      #
      # Scalar needs neither. Nothing is generated into the repository: no MDX, no sidebar slice, no
      # derived CSS. `@scalar/api-reference`'s renderer is vendored straight out of node_modules by
      # the bundler at build time (plugins/scalar-api-reference emits it as a content-hashed asset),
      # so it cannot drift from the installed version — the hash IS the check. And the OpenAPI
      # document travels as route data, so there is no committed copy to fall out of date either.
      #
      # What DOES protect the reference is the build step below: the plugin reads and parses
      # api/rest/schema/rest_api.yaml at build time and throws if it is missing or unparseable,
      # rather than shipping an empty reference. A step here would only re-run that.
      # THE ONE CHECK RESTORED AFTER THE 2026-08-14 REMOVAL, and it is not a style linter.
      # `static/` is copied verbatim into the published site, so anything left in it SHIPS
      # at a public URL, and nothing enumerated it. Three empty third-party-branded
      # placeholder files served HTTP 200 from the live site until a person read the
      # directory by hand. Its self-test below proves the check can fail, so it is a real
      # gate and not a vacuous one; it passes at HEAD.
      # THE ICON SET IS GENERATED, so it can drift like any other generated tree. The 34
      # `--sb-icon-*` mask tokens in src/css/sidebar-icons.scss and the vendored SVGs under
      # assets/icons/lucide/ are both produced from one REGISTRY in the script; this asserts
      # the committed files still equal a fresh run.
      #   Since 2026-08-16 the vendored folder has TWO legal states — LIBRARY (all 2,025
      # lucide-static SVGs, so an author can pick an icon offline) and PRUNED (only what the
      # site uses). The check requires an EXACT match with one of them, so the old protection
      # against dead weight accumulating still holds: a half-vendored tree fails.
      - name: Icon set matches its registry
        run: npm run icons:check
      - name: Static-asset orphan self-test (proves the check can fail)
        run: npm run lint:static-orphans:selftest
      - name: Static-asset orphans (every file under static/ is referenced)
        run: npm run lint:static-orphans
      # WIRING BETWEEN docusaurus.config.ts, sidebars/*.ts AND siteSections.ts — added
      # 2026-09-07, and it guards the one hole `tsc` structurally cannot see. `SidebarName` is
      # derived from the sidebar files (`keyof typeof import('@site/sidebars/…').default`) and
      # `Record<SidebarName, SiteSection>` is exhaustive over it, so renaming, adding or
      # removing a sidebar NAME is already a build error. The set of FILES that union reads is
      # three import paths written by hand, and no type can ask the config which files it
      # loads: add a fourth docs plugin instance with its own `sidebarPath` and everything
      # compiles while every page in that sidebar loses its panel header and its section
      # ancestors. This gate is that check, plus two more — that every `docsPluginId` names a
      # declared instance, and that all three sidebar files still carry a live
      # `LiteralSidebarKeys` guard, because a guard can be deleted and still compile.
      #   Its self-test runs first, as with the check above, so the gate is provably able to
      # fail: 1 baseline plus 5 detections.
      - name: Sidebar-source self-test (proves the check can fail)
        run: npm run lint:sidebar-sources:selftest
      - name: Sidebar sources (config, sidebars and siteSections agree)
        run: npm run lint:sidebar-sources
      # THE MUTATION PROOF'S ANCHORS, checked without running it. That tool is deliberately
      # not a gate — seven of its eight cases are what `npm run typecheck` below already
      # enforces, so gating it would add ~2 minutes per push to re-derive them. But its
      # anchors are hand-copied source snippets, so they rot as those files are edited, and
      # nothing would ever say so. `--check-anchors` asserts each still addresses its file
      # exactly once, mutates nothing, invokes no tsc, and runs in ~0.2s.
      - name: Mutation-proof anchors still address their files
        run: npm run verify:sidebar-names:anchors
      # SPINE SELF-TEST — the H2 page templates became enforceable on 2026-09-08. Until then
      # they were enforced by NOTHING: classify.py's own header recorded that a page could
      # drop a mandatory slot, reorder the grid or retitle a heading and every gate stayed
      # green, because nothing in this repository read a page's H2 sequence. The check itself
      # rides `gen:check` above as its sixth gate; this step is its self-test, and it earns a
      # step of its own for a specific reason.
      #
      # `slots_for` IS INVOKED ZERO TIMES DURING A FULL `gen:check` AND ZERO TIMES DURING
      # `gen:reference` — measured with a counting spy — because all 24 operation pages are
      # CARRY and build_page returns before the assembly loop. So the drift check cannot see
      # scripts/api/mqtt/config/spines.json at all, and "output is byte-identical" is a
      # VACUOUS claim about it: it holds no matter how wrong the file is. This self-test is
      # the only thing that runs the lookup on purpose, and it reads the REAL spines.json
      # rather than a fixture — see the schema-citation block below for what fixture self-tests
      # cost this repository once already.
      #
      # 21 cases. Among them: an unknown kind must RAISE (the fail-open defect that let
      # slots_for('telemetry') return a 7-slot spine with no payload section and no error),
      # `required` must not collapse into `mech`, dataEVT must be discovered as `telemetry`
      # rather than as an event, `Telemetry Semantics` must keep its pinned pre-rename slug
      # `event-semantics`, and all 25 generated pages must conform.
      - name: Reference-spine self-test (proves the check can fail)
        run: npm run gen:selftest
      # CONTRACT SELF-CONSISTENCY — added 2026-09-09. The contract was the ONLY unguarded
      # artifact in the chain: the reference that documents it has six gates in gen:check, a
      # reconciler at threshold 0, a spine gate and 21 self-test cases, and the statement of
      # truth itself had nothing. 21 defects were filed against it by hand on 2026-09-08/09,
      # and 12 of those surfaced ONLY because five new documentation sections had to make
      # positive claims about the data plane — a discovery method that neither scales nor
      # repeats.
      #
      # IT IS BASELINED, NOT ZERO-THRESHOLD, and that is the design rather than a compromise.
      # The contract must never be edited from this repository, so a zero-threshold gate would
      # sit permanently red on 311 findings nobody here is permitted to fix — precisely the
      # failure this file already records as the reason a gate was deactivated once. So the
      # question it asks is narrower and answerable: did the incoming drop introduce a NEW
      # defect of a class we can already detect? Counts live in
      # scripts/api/mqtt/config/contract-baseline.json and the gate fails when one MOVES.
      #
      # It fails when a count goes DOWN too. A defect fixed upstream is good news and leaves
      # the baseline stating something false about the contract, which is how a gate quietly
      # stops meaning anything. There is no per-finding suppression, deliberately.
      #
      # This does NOT replace an AsyncAPI spec validator and is not an attempt at one:
      # `npx @asyncapi/cli validate` returns 0 errors and 0 warnings on this document and
      # finds NONE of the 21, because they are not spec violations — they are a narrative
      # statement disagreeing with a keyword in the same file.
      - name: Contract-lint self-test (proves the check can fail)
        run: npm run gen:contract-lint:selftest
      - name: Contract self-consistency (no NEW defect class in the incoming drop)
        run: npm run gen:contract-lint
      # MESSAGE EXAMPLE NAMING AND ORDERING — added 2026-09-09, and it is the one gate here
      # that is ZERO-THRESHOLD against the contract rather than baselined. The distinction is the
      # whole point, so it is worth stating: gen:contract-lint above is baselined because its 311
      # findings are unfixable from this repository, and a gate born red is a gate born ignored.
      # This one measured 0 ERRORS on the tree it lands with, so a zero threshold is satisfiable
      # and it gets one. No baseline file, no per-finding suppression.
      #
      # WHAT IT CHECKS that nothing else does: `components.messages[*].examples[*].name` and the
      # SEQUENCE of `examples[]`. Both were entirely unguarded. Every other gate in this file reads
      # payloads, field types or prose; the example NAMES are the strings the published reference
      # pages inherit as their variant-dropdown labels, and a defect in one of them reaches a reader
      # as a mislabelled payload. 20 such labels were found by hand on 2026-09-09
      # (.ai-history/077-select-variant-fix.md) — a discovery method that does not repeat.
      #
      # THE 8 WARNINGS ARE NOT PROMOTED, DELIBERATELY. They are inherited irregularities: names
      # lifted from an upstream publisher, six of them a proper substring of a sibling and three
      # over the 56-character soft ceiling. Promoting them would demand rewording strings this
      # repository does not own, which forks the contract from the surface it documents — the exact
      # failure the doctrine exists to prevent, and the failure the header of this file already
      # records for the twenty-odd linters removed on 2026-08-14. Errors gate; warnings report.
      #
      # THE SELF-TEST RUNS FIRST, as every other gate here does, and it is not ceremony: the
      # checker refuses to run its rules at all if its own 17 fixtures fail, so a broken edit
      # cannot report a clean corpus. Both are ~0.3s and need nothing on disk but the contract.
      #   It is standard library only and imports NOTHING from this repository, so a refactor of
      # the generator beside it cannot break it, and it stays diffable against the upstream kit it
      # was adopted from. Provenance, the two configured constants and how to reconcile a future
      # upstream version: scripts/api/mqtt/docs/example-doctrine-provenance.md.
      - name: Example-doctrine self-test (proves the check can fail)
        run: npm run gen:example-doctrine:selftest
      - name: Message example names and order (naming N-1..N-27, ordering A/T/C rules)
        run: npm run gen:example-doctrine
      # THE SELF-TEST IS WIRED IN; THE CHECK ITSELF IS NOT, YET. One precondition remains and
      # it is named at the foot of this block. Both of the reasons this gate was deactivated on
      # 2026-09-06 have been discharged — re-measured 2026-09-08, not assumed:
      #
      #   REASON ONE WAS "the gate checks a thing nobody is permitted to fix". It listed 6
      # correct findings against names that do not exist: `refrence/events/alertEvent.yaml` (x3),
      # `refrence/payload/tagReportFilterPayload.yaml` (x2) and `events/exceptionEVT.json` (x1).
      # All three names now occur ZERO times across docs, api, scripts, README.md and
      # CONTRIBUTING.md. Five went in the citation sweep; the last two were prose in
      # message-envelope.mdx claiming the schema tree "contains two event definitions that never
      # reach the wire" and naming a third alert shape — neither file has ever existed in this
      # repository, so the page was citing two absences and a phantom.
      #
      #   REASON TWO WAS "THE CHECKER ITSELF IS BROKEN", and it was right. `--selftest` reported
      # 7 failed assertions and then died with `TypeError: Cannot read properties of undefined
      # (reading 'slice')`. Repaired 2026-09-08. The diagnosis, because it is the interesting part:
      # NONE of the 7 was a bug in the extractor. Every one was a FIXTURE asserting behaviour the
      # implementation had deliberately removed and the fixtures were never updated to match —
      # three demanded `(`, `:` and `,` still work as key separators after the header records
      # removing them for failing correct prose; two demanded an anchorless basename and an
      # off-tree name be dropped at extraction, which is precisely the blindness that let
      # `error_codes.json` be cited by 52 pages; one demanded a continuation be discarded when its
      # base is unresolvable, which is no longer true now that unresolvable bases are kept; and one
      # asserted an `unresolved` counter that was never implemented, which is now implemented and
      # asserted. The TypeError was a `c.short !== null` guard meeting a hand-built citation object
      # whose `short` key is absent — `undefined !== null` is true, so it fell through to
      # `.slice()`. Fixed by loosening the guard to `!= null` AND by making the self-test's default
      # object field-for-field identical to the one `extract()` returns, since a self-test that
      # simulates a narrower object than production cannot see production's bugs.
      #
      #   THE TESTS ROTTING WHILE THE CODE IMPROVED IS THE WHOLE ARGUMENT for wiring the self-test
      # in now. It is synthetic — it drives the extractor and verifier against fixtures and a
      # temporary tree, touching no repository content — so it cannot be made red by an authoring
      # decision, which is what made the check itself unsatisfiable. It is green, it is fast, and
      # it now proves 45 extraction cases, an unparseable-key case, an unresolved-token count and
      # 26 verification cases against a real tree, 17 of which must FAIL. Those 26 had never once
      # executed: the crash killed the run before reaching them.
      - name: Schema-citation self-test (proves the check can fail)
        run: npm run lint:schema-citations:selftest
      # RESTORING THE CHECK ITSELF NEEDS EXACTLY ONE MORE FIX, and it is not in this gate's scope
      # to make. `docs/guides/get-oriented/what-the-iot-connector-is.mdx:40` cites
      # `tag_config.json`, which was renamed to `operation-order.json` in feabb13e — a citation
      # this very gate caught and the rename did not. It is the sole finding; the gate is otherwise
      # green on this tree. The owner has scoped the Guides tree to a separate authoring pass, so
      # the line is deliberately left alone rather than fixed ahead of it.
      #   A GATE YOU ARE FORBIDDEN TO SATISFY IS NOT A GATE. Wired now it would fail every push to
      # main, and because deploy.yml calls this workflow that would block the gh-pages publish
      # indefinitely — turning one real finding into a permanently red light the next person learns
      # to route around. That is the failure mode the header of this file describes for the
      # twenty-odd linters removed on 2026-08-14, and re-creating it one gate at a time is worse
      # than not having the gate. `continue-on-error` is not the answer either: a permanently
      # yellow step is routed around just as fast.
      #   SO: uncomment the two lines below in the same commit that fixes that one citation.
      # Nothing else is needed — the alias is already in package.json and the self-test above
      # already guards the instrument.
      #
      # WHAT THE CHECK IS FOR, kept because it is still the reason to finish this. It is not a
      # style linter: it is the prose asserting a fact about a schema. `error_codes.json` was
      # renamed to `response_codes.json` and 52 `.mdx` files went on citing the old name for the
      # whole of that window, including the page that told the reader it "is generated from the
      # schema and never hand-maintained". Nothing noticed, because a citation is just a string in
      # prose. Fixed 2026-09-05; see .ai-history/065-additional-fixes.md 2.4.
      #   The strongest of its four checks reads line NN of the cited file and requires the quoted
      # key to actually be on it — checks that stop at "file exists, file is long enough" passed on
      # all five of the anchors that had SLID in message-envelope.mdx. Existence resolves against
      # `git ls-files` rather than `fs.statSync`, so a wrong-case citation cannot pass on a Windows
      # author's machine and fail on this ubuntu-latest runner.
      #
      # A NEW CHECK, NOT A RESTORED ONE — `git log -S'lint:schema-citations'` returns nothing,
      # because this gate has never existed in this history. The one check restored after the
      # 2026-08-14 removal is the static-asset scan above (lint-static-orphans.mjs:11 says so),
      # and the removed linters are still in no clone and no commit, exactly as recorded at the
      # top of this file. Nothing here contradicts that.
      #
      # IT NOW CHECKS JSON POINTERS TOO, which is the half that makes it survive the migration.
      # The 2026-09-06 decision said this checker "should be rewritten against the AsyncAPI
      # document rather than repaired against this one". Both happened, and they were not
      # exclusive: the file half was repaired, and a pointer half was added beside it on
      # 2026-09-08. It resolves every `#/...` citation against the contract in three forms —
      # literal, braced (`{universal,scoped}`) and templated (`<op>`, satisfied by at least one
      # real child) — and where the prose also claims a member count, `(38 rows)`, it compares
      # that number against the real length of the node. That last check is the one with history:
      # this repository published "35 response codes" against a catalogue of 38 for a whole
      # window, and the sweep had to correct it by hand on four pages.
      #   WHY IT MATTERED BEFORE THE DELETION, not after. Measured 2026-09-08: the contract was
      # cited by full path exactly ONCE site-wide, its filename cannot match the shortened-citation
      # pattern because of its hyphens, and the 15 pointer citations the sweep established as house
      # style were verified by NOTHING — so citing the contract correctly made a citation invisible
      # to CI while citing a doomed legacy file got it verified. Deleting the legacy tree in that
      # state would have traded ~150 mechanically verified citations for ~5 with this gate still
      # green. Proven by execution rather than argued: with all 117 legacy files removed from the
      # index, all 15 pointer citations still verify.
      # - name: Schema citations (cited schema paths, lines and keys are real)
      #   run: npm run lint:schema-citations
      - name: Typecheck (tsc)
        run: npm run typecheck
      # ITS SELF-TEST RUNS BEFORE THE BUILD, the check itself after it — the two halves of
      # this gate have different inputs. The self-test drives the extractors and the map parser
      # with synthetic HTML and needs nothing on disk, so it can fail fast; the check reads
      # build/ and cannot run until the site exists.
      - name: Section-rendering self-test (proves the check can fail)
        run: npm run lint:section-rendering:selftest
      - name: Build Docusaurus site
        run: npm run build
      # THE RENDERED SITE MUST AGREE WITH `SECTIONS_BY_SIDEBAR` — added 2026-09-07, and it is
      # the only gate here that reads the DOM rather than the source. The map has two readers,
      # the sidebar panel header and the breadcrumb trail, which render a few hundred pixels
      # apart; both typecheck perfectly while rendering different strings, because a
      # disagreement between them lives in the HTML they produce and not in the data they read.
      # Expectations are derived from the map itself and the ancestor chain is recomputed from
      # its `parent` edges, so this needs no upkeep when a section is added or re-parented.
      - name: Section rendering (panel title and crumbs match the map)
        run: npm run lint:section-rendering
      # PDF GENERATION IS A DEPLOY-PATH STEP AND WAS GATED NOWHERE, 2026-08-15.
      # deploy.yml runs `npm run pdf` between the build and the gh-pages publish, and
      # scripts/site/generate-pdfs.mjs walks api/mqtt/reference/{mgmt,ctrl,events,data}
      # to derive its routes. Every restructure of that tree therefore passed CI green
      # and could still break the deploy — the failure landed after the gate, on main.
      # Running it here makes the reference-tree contract a pull-request-time failure.
      # It needs the build above, so it must stay after that step.
      # `npm run pdf` renders through Chromium, and validate.yml stopped installing
      # Playwright on 2026-08-14 when the rendered-CSS linter was deactivated. The gate
      # is useless without it, so the install comes back — cached on the lockfile hash,
      # the same key deploy.yml uses, so the two jobs share one warm cache.
      # v6, NOT v4. `actions/cache@v4` declares `using: node20`, and the runner now forces
      # those onto Node 24 and annotates every run to say so. v4 was the last Node-20 major;
      # v5 and v6 both declare `using: node24`, so either clears it. v6 is chosen because it
      # is the current major and its only documented change over v5 is an internal ESM
      # migration — pinning v5 would mean doing this again when that line ends. Nothing
      # about our usage can notice the difference: both call sites pass only `path` and
      # `key`, which neither major altered.
      #   Verified rather than assumed: actions/cache v4 -> node20, v5 -> node24,
      # v6 -> node24, read from each tag's own action.yml. And v6 is the ONLY bump needed —
      # checkout@v5, setup-node@v5, setup-python@v6 and the SHA-pinned
      # peaceiris/actions-gh-pages all already declare node24, so cache was the sole laggard.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate reference PDFs (guards the deploy-only step)
        run: npm run pdf
